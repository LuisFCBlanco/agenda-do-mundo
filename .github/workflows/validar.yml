name: Conferir contribuição

on:
  pull_request:
    paths: ["textos/**", "gerar.py", "config.json", "validar.py"]

permissions:
  contents: read

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Regras de escrita
        run: python validar.py textos/*/*.json
      - name: O gerador roda com os textos novos
        run: SEM_REDE=1 python gerar.py
